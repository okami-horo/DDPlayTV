<script>
const data=JSON.parse(document.getElementById('dataset').textContent);
let selected='all',kind='all',visible=[],currentIndex=0,showMarks=true;
const grid=document.getElementById('grid'),viewer=document.getElementById('viewer');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function marks(screen){return screen.annotations.filter(m=>selected==='all'||m.issue===selected)}
function overlay(screen){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${screen.width} ${screen.height}`);svg.classList.add('marks');svg.setAttribute('aria-hidden','true');const fs=Math.round(screen.width/58);for(const m of marks(screen)){const [xp,yp,wp,hp]=m.rect,x=xp*screen.width/100,y=yp*screen.height/100,w=wp*screen.width/100,h=hp*screen.height/100;const r=document.createElementNS(ns,'rect');Object.entries({x,y,width:w,height:h,rx:7,class:'outline'}).forEach(([k,v])=>r.setAttribute(k,v));svg.append(r);const tagY=Math.max(0,y-fs*1.35),tr=document.createElementNS(ns,'rect');Object.entries({x,y:tagY,width:fs*2.8,height:fs*1.35,rx:3,class:'tag'}).forEach(([k,v])=>tr.setAttribute(k,v));svg.append(tr);const t=document.createElementNS(ns,'text');t.setAttribute('x',x+fs*.15);t.setAttribute('y',tagY+fs*1.04);t.setAttribute('font-size',fs);t.textContent=m.issue;svg.append(t)}return svg}
function shot(screen,container){const img=el('img');img.src=screen.file;img.width=screen.width;img.height=screen.height;img.alt=screen.title;img.loading=container.classList.contains('shot')?'lazy':'eager';container.append(img,overlay(screen));return container}
function render(){visible=data.screens.filter(s=>(selected==='all'||s.issues.includes(selected))&&(kind==='all'||s.kind===kind));grid.replaceChildren();for(const [index,s]of visible.entries()){const card=el('article','card'),head=el('div','card-head');head.append(el('h2','',s.id+' · '+s.title));head.append(el('span','badge '+(s.kind==='native'?'native':'proto'),s.kind==='native'?'历史原生 · 非本次抓取':'设计原型 · 2026-11-02 渲染'),el('span','muted small',s.width+' × '+s.height));const button=el('button','shot');button.setAttribute('aria-label','放大 '+s.title);button.onclick=()=>openImage(index);shot(s,button);const caption=el('div','caption'),ul=el('ul');for(const m of marks(s))ul.append(el('li','',m.issue+'：'+m.text));caption.append(ul);if(s.note)caption.append(el('p','note',s.note));const link=el('a','','打开无标注原图 ↗');link.href=s.file;link.target='_blank';link.rel='noopener';caption.append(link);card.append(head,button,caption);grid.append(card)}document.getElementById('count').textContent=visible.length+' 张截图';document.querySelectorAll('[data-issue]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.issue===selected)));document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));const guide=document.getElementById('guide');guide.replaceChildren();if(selected==='all'){guide.append(el('strong','','7 类问题均待你确认'),el('p','muted','选择上方问题编号可逐类查看；同一张截图可对应多个观察点。'))}else{const issue=data.issues.find(i=>i.id===selected);guide.append(el('strong','',issue.id+' · '+issue.title),el('p','',issue.description));const a=el('a','small','打开该类标注总览图 ↗');a.href=selected+'.jpg';a.target='_blank';guide.append(a)}document.body.classList.toggle('hide-marks',!showMarks)}
function showCurrent(){const s=visible[currentIndex];document.getElementById('modal-title').textContent=s.id+' · '+s.title+'（'+(s.kind==='native'?'历史原生':'设计原型')+'）';const holder=document.getElementById('modal-image');holder.replaceChildren();shot(s,holder);document.getElementById('original').href=s.file;const info=document.getElementById('modal-info');info.replaceChildren();for(const m of marks(s))info.append(el('p','',m.issue+'：'+m.text));if(s.note)info.append(el('p','muted small',s.note));document.getElementById('prev').disabled=currentIndex===0;document.getElementById('next').disabled=currentIndex===visible.length-1;document.getElementById('modal-marks').textContent=showMarks?'隐藏标注':'显示标注';viewer.scrollTop=0}
function openImage(index){currentIndex=index;showCurrent();viewer.showModal();document.body.classList.add('modal-open')}
function move(delta){if(currentIndex+delta<0||currentIndex+delta>=visible.length)return;currentIndex+=delta;showCurrent()}
function setMarks(value){showMarks=value;document.body.classList.toggle('hide-marks',!value);document.getElementById('show-marks').checked=value;document.getElementById('modal-marks').textContent=value?'隐藏标注':'显示标注'}
const nav=document.getElementById('issues');for(const i of [{id:'all',title:'全部问题'},...data.issues]){const b=el('button','',i.id==='all'?i.title:i.id+' '+i.title);b.dataset.issue=i.id;b.setAttribute('aria-pressed',String(i.id==='all'));b.onclick=()=>{selected=i.id;history.replaceState(null,'',selected==='all'?'#all':'#'+selected);render()};nav.append(b)}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;render()});document.getElementById('show-marks').onchange=e=>setMarks(e.target.checked);document.getElementById('modal-marks').onclick=()=>setMarks(!showMarks);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('close').onclick=()=>viewer.close();viewer.addEventListener('close',()=>document.body.classList.remove('modal-open'));viewer.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});if(data.issues.some(i=>'#'+i.id===location.hash))selected=location.hash.slice(1);render();
</script></html>
