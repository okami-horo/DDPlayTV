a .dot{font-size:10px;color:#6e7280}.tag{font-size:12px;color:#c8cbd4;border:1px solid #ffffff20;border-radius:5px;padding:2px 5px;white-space:nowrap}.primary{height:55px;background:#f1f1f3;color:#17181d;border-radius:12px;font-size:19px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 28px}.primary svg{width:18px;height:18px;fill:currentColor}.secondary{height:44px;border-radius:10px;background:#ffffff0b;color:#cdd0db;padding:0 18px;font-size:15px}.text-action{background:transparent;color:#b4b7c5;font-size:14px;padding:6px 2px;text-align:left;border-radius:4px}.text-action:hover{color:#fff}.poster{object-fit:cover;border-radius:12px;box-shadow:0 16px 36px #0005}.eyebrow{font-size:12px;letter-spacing:2px;color:#8e94a7}.resume-status{font-size:15px;color:#d5d7e1;margin-bottom:11px;display:flex;align-items:center;gap:8px}.status-dot{width:6px;height:6px;background:#b1c7e9;border-radius:50%;display:inline-block}.resume-time{display:flex;justify-content:space-between;gap:16px;color:#8e93a4;font-size:13px;margin-top:12px;font-variant-numeric:tabular-nums}.progress-track{height:3px;background:#ffffff13;border-radius:3px;overflow:hidden;margin-top:9px}.progress-track span{display:block;height:100%;background:#b1c7e9;border-radius:3px}.episode-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.episode-header h2 small{font-size:14px;color:#8e94a4;font-weight:400;margin-left:13px}.seasons{display:flex;gap:9px;align-items:center}.season{height:38px;border-radius:9px;background:transparent;color:#9da2b2;padding:0 16px;font-size:15px}.season.selected{background:#ffffff13;color:#fff}.season-static{font-size:14px;color:#d8dae2;padding:9px 14px;background:#ffffff0c;border-radius:8px}.still{display:block;object-fit:cover;background:#242b3a}.still-placeholder{background:linear-gradient(125deg,#303d51,#1b222e 65%,#222232);display:flex;align-items:center;justify-content:center;position:relative;color:#adb9cd .layout-b{position:absolute;inset:82px 0 0}.b-hero{height:338px;padding:8px 62px 0;position:relative;overflow:hidden;display:flex;align-items:center}.b-ambient{position:absolute;right:0;top:-70px;width:650px;height:510px;object-fit:cover;object-position:center 35%;filter:blur(32px) saturate(.5);opacity:.17;mask-image:linear-gradient(90deg,transparent,#000)}.b-hero .poster{position:absolute;right:105px;top:15px;width:178px;height:267px;transform:rotate(3deg)}.b-copy{width:930px;position:relative}.b-copy h1{font-size:36px;line-height:1.4;max-width:870px;margin:0 0 14px}.b-copy .meta{margin-bottom:14px}.b-copy p{font-size:16px;max-width:750px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.b-actions{display:flex;gap:16px;align-items:center;margin-top:20px}.b-resume-note{margin-top:14px;color:#9ca4b7;font-size:14px}.b-resume-note span{color:#cdd8ea}.b-shelf{border-top:1px solid #ffffff09;background:linear-gradient(#15171d,#101116);height:390px;padding:25px 62px 10px}.b-shelf .episode-header{margin-bottom:14px}.b-shelf .episode-scroll{display:flex;overflow-x:auto;gap:23px;margin:0 -9px;padding:8px 9px 15px}.episode-card{width:292px;min-width:292px;text-align:left;background:transparent;border-radius:10px;padding:0 0 8px;position:relative}.episode-card:focus-visible{background:#242832}.episode-card .still-wrap{position:relative}.episode-card .still{width:292px;height:164px;border-radius:10px}.episode-card .still-placeholder span{font-size:48px}.episode-card .episode-name{margin:13px 6px 0;font-size:18px}.episode-card .episode-secondary{margin:8px 6px 0}.episode-card .current-label{position:absolute;left:9px;top:9px;background:#121824d9;border-radius:6px;padding:5px 9px;font-size:11px}.episode-card .progress-track{position:absolute;bottom:0;left:0;right:0;background:#0006;height:3px}.b-shelf .no-content{min-height:200px;height:240px;gap:12px}.b-shelf .skeleton-row{min-width:292px;height:210px;display:block}.b-shelf .skeleton-row>.skeleton{height:164px!important}.b-shelf .skeleton-lines{margin-top:14px}

.overlay{position:absolute;inset:0;z-index:20;background:#05070bbd;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(9px)}.dialog{width:640px;max-height:670px;overflow:auto;background:#20232c;border:1px solid #ffffff15;border-radius:23px;padding:35px;box-shadow:0 35px 100px #0008}.dialog h2{margin-bottom:12px}.dialog>p{font-size:16px;margin-bottom:20px}.dialog .version{width:100%;display:flex;justify-content:space-between;gap:20px;text-align:left;padding:20px;background:#ffffff07;border-radius:12px;margin:12px 0}.version strong{display:block;font-size:18px}.version small{display:block;font-size:13px;color:#929aad;margin-top:9px;overflow-wrap:anywhere;line-height:1.5}.version>span{font-size:13px;white-space:nowrap;color:#bac7df}.dialog .secondary{margin-top:18px}.play-preview{text-align:center}.play-preview .play-orb{width:88px;height:88px;border-radius:50%;background:#e9ecf4;color:#151821;margin:0 auto 28px;display:grid;place-items:center}.play-preview .play-orb svg{width:28px;fill:currentColor}.play-preview p{margin-top:16px}.play-preview .progress-track{margin:24px auto 0;max-width:360px}.before-overlay{position:fixed;inset:0;background:#08090cf5;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:45px}.before-overlay img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;border:1px solid #ffffff1a;border-radius:10px}.before-overlay button{border-radius:10px;background:#252833;padding:12px 22px}.review-footer{height:86px;position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 30px;color:#6f7689;font-size:11px}.review-footer .note{margin-left:auto;max-width:260px;text-align:right}.viewport:fullscreen{width:100vw!important;height:100vh!important;border-radius:0;outline:0;display:flex;justify-content:center;align-items:center}.viewport:fullscreen .stage{position:relative;flex-shrink:0;transform-origin:center}.off{display:none!important}@media(max-width:1050px){.review-header small{display:none}.review-footer>.keys,.review-footer>.note{display:none}.review-header{padding:0 18px}.workspace{padding:0 16px}}

<body>
<header class="review-header">
  <div><strong>DDPlayTV · 剧集详情设计</strong><small>封面与前两集剧照来自电视截图；数量、后续集数和进度为示例</small></div>
  <div class="review-controls">
    <select id="scenario" aria-label="预览场景"><option value="normal">常规 · 有观看进度</option><option value="seasons">多季 / 特别篇</option><option value="versions">同集多个版本</option><option value="fresh">尚未观看</option><option value="unknown">未知总时长</option><option value="missing">上次文件不可用</option><option value="empty">没有已入库剧集</option><option value="loading">加载剧集</option><option value="movie">电影 / 文件版本</option><option value="invalid">作品资料失效</option><option value="initial">首次读取 / 无缓存</option></select>
    <button id="before">电视现状</button><button id="fullscreen">全屏预览</button>
  </div>
</header>
<main class="workspace" id="workspace"><div class="viewport" id="viewport"><div class="stage" id="stage" tabindex="-1"></div></div></main>
<footer class="review-footer">
  <span class="keys">方向键移动 · Enter 确认 · Esc 返回</span>
  <div class="selected-design">已选 B · 沉浸剧集</div>
  <span class="note" id="review-note">设计原型 · 尚未接入应用</span>
</footer>
<script>
const stage=document.getElementById('stage'), viewport=document.getElementById('viewport');
const params=new URLSearchParams(location.search);
const variant='B';
let scenario=[...document.getElementById('scenario').options].some(o=>o.value===params.get('state'))?params.get('state'):'normal';
let season=1, overlay=null, opener='resume';
const assets='previews/series-detail/';
const title='乱世千金倪亚·利斯顿转生成为娇弱千金的弑神武人华丽无双录';
const overview='拥有最强前世的转生千金，第二人生也要大闹天下。在病弱的千金倪亚·利斯顿体内苏醒后，她决定以自己的方式，重新踏上这片未知的世界。';
const names=['自黑暗中浮现','王都的工作','舞台落幕之后'];
const playIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17L20 12z"/></svg>';
const current=()=>scenario!=='fresh'&&scenario!=='empty'&&scenario!=='loading';
const episodeCount=()=>scenario==='empty'||scenario==='loading'?0:season===0?2:season===2?6:12;
const progress=()=>scenario==='unknown'?null:42;
function episode(n,episodeSeason=season){return {n,title:episodeSeason===1?(names[n-1]||`第 ${n} 集`):episodeSeason===0?`特别篇 ${n}`:`第 ${n} 集`,image:episodeSeason===1&&n<=2?`${assets}episode-${n}.png`:null,latest:current()&&episodeSeason===1&&n===3,multiple:scenario==='versions'&&episodeSeason===1&&n===3};}
function still(ep,extra=''){return ep.image?`<img class="still ${extra}" src="${ep.image}" alt="">`:`<div class="still still-placeholder ${extra}"><span>${String(ep.n).padStart(2,'0')}</span></div>`;}
function header(){return `<header class="stage-header"><div class="crumb"><span class="brand"><span class="brand-mark">▶</span> DDPlayTV</span><i></i><span>观看足迹 / 作品详情</span></div>${['invalid','initial'].includes(scenario)?'':`<span class="source-label">115${scenario==='movie'?'':` · ${scenario==='seasons'?'多季示例':'第 1 季'}`}</span>`}</header>`;}
function metadata(){return '<div class="meta"><span>2026</span><span class="dot">●</span><span>动画 · 奇幻</span><span class="tag">剧集</span></div>';}
function seasonBar(){return scenario==='seasons'?`<div class="seasons">${[1,2,0].map(n=>`<button data-key="season-${n}" data-season="${n}" class="season ${season===n?'selected':''}" aria-pressed="${season===n}">${n===0?'特别篇':`第 ${n} 季`}</button>`).join('')}</div>`:'<span class="season-static">第 1 季</span>';}
function progressBar(value=42){return `<div class="progress-track"><span style="width:${value}%"></span></div>`;}
function episodeHeading(){return `<div class="episode-header"><h2>剧集<small>${scenario==='loading'?'加载中':`${episodeCount()} 集`}</small></h2>${seasonBar()}</div>`;}
function emptyOrLoading(){
  if(scenario==='loading')return Array.from({length:5},()=>'<div class="skeleton-row"><div class="skeleton" style="height:65px"></div><div class="skeleton-lines"><i></i><i></i></div></div>').join('');
  if(scenario==='empty')return '<div class="no-content"><div class="empty-icon">▤</div><h3>还没有可播放的剧集</h3><p>可以先到媒体库找到这部作品的文件。</p><button class="secondary" data-key="browse" data-action="library">浏览媒体库</button></div>';
  return '';
}
function card(ep){return `<button class="episode-card" data-key="episode-${ep.n}" data-episode="${ep.n}"><div class="still-wrap">${still(ep)}${ep.latest?'<span class="current-label">上次观看</span>':''}${ep.latest&&progress()!==null?progressBar():''}</div><div class="episode-name">${String(ep.n).padStart(2,'0')} · ${ep.title}</div><div class="episode-secondary"><span>${ep.latest?(progress()===null?'已观看 10:08':'本集 42%'):'24 分钟'}</span>${ep.multiple?'<span class="badge">2 个版本</span>':''}${ep.latest&&scenario==='missing'?'<span>暂不可用</span>':''}</div></button>`;}
function SupplementB(){
 const movie=scenario==='movie', initial=scenario==='initial';
 const heading=movie?'深海来信':initial?'正在读取作品资料…':'作品资料暂不可用';
 const copy=movie?'有些故事，值得慢慢看。从上次停下的地方，再次出发。':initial?'':'可以从媒体库检查来源与作品资料。';
 return '<section class="layout-b"><section class="b-hero">'+(movie?'<img class="poster" src="'+assets+'poster.png" alt="示例海报">':'')+'<div class="b-copy"><h1>'+heading+'</h1><div class="meta">'+(movie?'2026 · 剧情 · 电影':'')+'</div><p>'+copy+'</p><div class="b-actions"><button class="primary" data-key="resume" data-action="resume" '+(movie?'':'disabled')+'>'+playIcon+(movie?'继续播放':'开始观看')+'</button>'+(movie?'<button class="secondary" data-key="synopsis" data-action="synopsis">完整简介</button><button class="text-action" data-key="manage" data-action="manage">管理资料</button>':'')+'</div><div class="b-resume-note">'+(movie?'上次观看至 42% · 115':initial?'':'暂无可播放文件')+'</div></div></section><section class="b-shelf"><div class="episode-header"><h2>'+(movie?'影片文件<small>2 个版本</small>':'剧集')+'</h2></div><div class="episode-scroll">'+(movie?'<button class="episode-card" data-key="episode-1" data-action="movie-versions"><div class="still-wrap"><img class="still" src="'+assets+'episode-1.png" alt=""><span class="current-label">上次观看</span>'+progressBar()+'</div><div class="episode-name">深海来信</div><div class="episode-secondary">本文件 42% · 2 个版本</div></button>':'<div class="no-content" style="width:100%"><p>'+(initial?'正在读取作品资料…':'作品资料暂不可用，可从媒体库检查来源。')+'</p>'+(initial?'':'<button class="secondary" data-key="browse" data-action="library">浏览媒体库</button>')+'</div>')+'</div></section></section>';
}
function VariantB(){if(['movie','invalid','initial'].includes(scenario))return SupplementB();const disabled=['loading','empty','missing'].includes(scenario);return `<section class="layout-b"><section class="b-hero"><img class="b-ambient" src="${assets}poster.png" alt=""><img class="poster" src="${assets}poster.png" alt="作品海报"><div class="b-copy"><h1>${title}</h1>${metadata()}<p>${overview}</p><div class="b-actions"><button class="primary" data-key="resume" data-action="resume" ${disabled?'disabled':''}>${playIcon}${scenario==='fresh'?'开始观看':scenario==='missing'?'上次文件不可用':scenario==='empty'?'暂无可播放剧集':scenario==='loading'?'正在加载':'继续播放 · 第 3 集'}</button><button class="secondary" data-key="synopsis" data-action="synopsis">完整简介</button><button class="text-action" data-key="manage" data-action="manage">管理资料</button></div><div class="b-resume-note">${current()?`<span>第 1 季第 3 集</span> · ${progress()===null?'已观看 10:08':'本集 42%'} · 115${scenario==='missing'?' · 可选择其他集':''}`:scenario==='fresh'?'从第 1 季第 1 集开始':'已有作品资料会保留'}</div></div></section><section class="b-shelf">${episodeHeading()}<div class="episode-scroll">${emptyOrLoading()||Array.from({length:episodeCount()},(_,i)=>card(episode(i+1))).join('')}</div></section></section>`;}
function syncURL(){const url=new URL(location.href);url.searchParams.set('variant',variant);url.searchParams.set('state',scenario);history.replaceState(null,'',url);}
function focusKey(key){const node=stage.querySelector(`[data-key="${key}"]:not(:disabled)`);if(node){node.focus({preventScroll:true});if(node.dataset.episode)node.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});return true;}return false;}
function defaultFocus(){if(!focusKey('resume')&&!focusKey('episode-1')&&!focusKey('browse'))focusKey('manage');}
function render(key){overlay=null;stage.innerHTML=header()+VariantB();document.getElementById('scenario').value=scenario;document.getElementById('review-note').textContent='B 已选定 · 原生实现与验证进行中';syncURL();if(!key||!focusKey(key))defaultFocus();}
function showOverlay(content,key){opener=document.activeElement?.dataset.key||'resume';overlay=key;stage.insertAdjacentHTML('beforeend',`<div class="overlay" id="overlay"><section class="dialog ${key==='play'?'play-preview':''}" role="dialog" aria-modal="true">${content}</section></div>`);const target=stage.querySelector('#overlay button:not(:disabled)');if(target)target.focus();else{const dialog=stage.querySelector('#overlay .dialog');dialog.tabIndex=-1;dialog.focus();}}
function closeOverlay(){document.getElementById('overlay')?.remove();overlay=null;if(!focusKey(opener))defaultFocus();}
function play(n,source='115',episodeSeason=season){const ep=episode(n,episodeSeason),resumeHistory=ep.latest&&source==='115';if(scenario==='missing'&&resumeHistory){showOverlay('<h2>原文件暂不可用</h2><p>已有进度会保留。可以选择其他集，或稍后重试。</p><button class="secondary" data-key="dismiss" data-action="dismiss">知道了</button>','failure');return;}showOverlay(`<div class="play-orb">${playIcon}</div><h2>${resumeHistory?'继续播放':'播放'} · 第 ${episodeSeason} 季第 ${n} 集</h2><p>${ep.title} · ${source}</p>${resumeHistory&&progress()===null?'<p>已观看 10:08</p>':progressBar(resumeHistory?42:0)}<p style="font-size:13px;color:#939baa">播放交互预览 · 不连接真实媒体</p>`,'play');}
function activateEpisode(n){const ep=episode(n);if(ep.multiple){showOverlay(`<h2>选择播放版本</h2><p>第 ${season} 季第 ${n} 集 · ${ep.title}</p><button class="version" data-key="version-115" data-play="${n}" data-source="115"><div><strong>115</strong><small>乱世千金倪亚·利斯顿 - S01E03.mp4</small></div><span>上次观看 · 42%</span></button><button class="version" data-key="version-nas" data-play="${n}" data-source="家庭 NAS"><div><strong>家庭 NAS</strong><small>乱世千金倪亚·利斯顿.S01E03.1080p.mkv</small></div><span>未播放</span></button><button class="secondary" data-key="cancel" data-action="dismiss">取消</button>`,'versions');}else play(n);}
stage.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.season!==undefined){season=Number(button.dataset.season);render(button.dataset.key);}else if(button.dataset.episode){activateEpisode(Number(button.dataset.episode));}else if(button.dataset.play){const originalOpener=opener;document.getElementById('overlay')?.remove();overlay=null;play(Number(button.dataset.play),button.dataset.source);opener=originalOpener;}else{switch(button.dataset.action){case 'movie-versions':showOverlay('<h2>选择实际文件版本</h2><button class="version" data-key="movie-115" data-action="resume">115 · 深海来信.mp4 · 上次观看至 42%</button><button class="version" data-key="movie-nas" data-action="demo">NAS · 深海来信.mkv · 尚未观看</button><button class="secondary" data-key="cancel" data-action="dismiss">取消</button>','versions');break;case 'resume':if(scenario==='movie'){showOverlay('<h2>继续播放 · 深海来信</h2><p>115 · 原文件进度 42%</p>','play');break;}play(scenario==='fresh'?1:3,'115',1);break;case 'dismiss':closeOverlay();break;case 'synopsis':showOverlay(`<h2>${title}</h2><p>${overview}</p><p>本预览使用电视实拍中的作品长标题，检查文字阅读、信息层级与操作位置。</p><button class="secondary" data-key="dismiss" data-action="dismiss">收起简介</button>`,'synopsis');break;case 'manage':showOverlay('<h2>作品资料</h2><p>此处衔接现有的资料与识别问题页面。</p><button class="version" data-key="reidentify" data-action="demo"><strong>重新识别</strong></button><button class="version" data-key="refresh" data-action="demo"><strong>刷新资料</strong></button>','manage');break;case 'library':showOverlay('<h2>媒体库入口</h2><p>实际应用将前往已连接的媒体来源。本原型只预览详情页。</p>','library');break;case 'demo':button.textContent='已演示此操作';break;}}});
function moveFocus(direction){
 const key=document.activeElement.dataset.key||'',lastEpisode=current()&&season===1?3:1;
 if(!overlay){
  if(key==='resume'&&direction==='ArrowDown'&&focusKey('episode-'+lastEpisode))return;
  if(key.startsWith('episode-')){
   if(direction==='ArrowUp'&&(focusKey('season-'+season)||focusKey('resume')))return;
   if(direction==='ArrowLeft'||direction==='ArrowRight'){focusKey('episode-'+(Number(key.substring(8))+(direction==='ArrowLeft'?-1:1)));return;}
  }
 }
 const container=overlay?document.getElementById('overlay'):stage,active=document.activeElement,rect=active.getBoundingClientRect();
 const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,horizontal=direction==='ArrowLeft'||direction==='ArrowRight',sign=direction==='ArrowLeft'||direction==='ArrowUp'?-1:1;
 let best=null,score=Infinity;
 for(const button of container.querySelectorAll('button:not(:disabled)')){
  if(button===active||!button.offsetWidth)continue;
  const r=button.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,forward=(horizontal?x-cx:y-cy)*sign,cross=Math.abs(horizontal?y-cy:x-cx);
  if(forward<6)continue;
  const aligned=horizontal?Math.min(rect.bottom,r.bottom)>Math.max(rect.top,r.top):Math.min(rect.right,r.right)>Math.max(rect.left,r.left);
  const value=forward+cross*(aligned?1.8:4.5)+(aligned?0:160);if(value<score){score=value;best=button;}
 }
 if(best){best.focus({preventScroll:true});if(best.dataset.episode)best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});}
}
document.addEventListener('keydown',event=>{if(event.target.matches('select,input,textarea,[contenteditable]'))return;if(event.key==='Escape'||event.key==='Backspace'){if(document.getElementById('before-overlay')){document.getElementById('before-overlay').remove();defaultFocus();}else if(overlay)closeOverlay();else if(stage.contains(document.activeElement))defaultFocus();event.preventDefault();return;}if(!event.key.startsWith('Arrow'))return;if(stage.contains(document.activeElement)){moveFocus(event.key);event.preventDefault();}});
document.getElementById('scenario').onchange=event=>{scenario=event.target.value;season=1;render();};
document.getElementById('before').onclick=()=>{const panel=document.createElement('div');panel.id='before-overlay';panel.className='before-overlay';panel.innerHTML=`<img src="${assets}tv-before.png" alt="电视上的详情页，2026年11月1日截图"><button id="close-before">返回设计预览</button>`;document.body.append(panel);panel.querySelector('button').onclick=()=>{panel.remove();defaultFocus();};panel.querySelector('button').focus();};
function resize(){const box=document.getElementById('workspace');const fullscreen=!!document.fullscreenElement;const scale=Math.min(fullscreen?innerWidth/1440:(box.clientWidth-52)/1440,fullscreen?innerHeight/810:box.clientHeight/810,fullscreen?10:1);if(!fullscreen){viewport.style.width=1440*scale+'px';viewport.style.height=810*scale+'px';}stage.style.transform=`scale(${scale})`;}
document.getElementById('fullscreen').onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await viewport.requestFullscreen();resize();defaultFocus();};new ResizeObserver(resize).observe(document.getElementById('workspace'));document.addEventListener('fullscreenchange',resize);render();resize();
</script>
</body>
