<h1>A02 · 原生实现截图</h1><p>任务模拟器 API 34，1440×810 / 240dpi。包含 33 张普通字体、6 张 1.3 倍字体截图，覆盖 F01–F12。点击图片查看原尺寸。</p>
<p>主按钮连续填充；普通焦点为单层 2dp；导航／季页签独立保留选中短标记；轨道勾选在失焦后仍可见。保留原页面结构、尺寸和紧凑次级播放键 1.5dp。素材为本地测试夹具。</p>
