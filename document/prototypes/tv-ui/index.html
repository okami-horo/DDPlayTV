function art(index){const c=films[index].colors;return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="${c[1]}"/><stop offset="1" stop-color="${c[0]}"/></linearGradient><radialGradient id="glow"><stop stop-color="#d1e1dd" stop-opacity=".18"/><stop offset="1" stop-color="#d1e1dd" stop-opacity="0"/></radialGradient></defs><path fill="url(#sky)" d="M0 0h1200v700H0z"/><ellipse cx="850" cy="260" rx="380" ry="330" fill="url(#glow)"/><circle cx="870" cy="188" r="${index===3?53:33}" fill="#e5e2d7" opacity=".8"/><path d="M0 430 160 315 280 368 480 207 640 380 800 310 1020 405 1200 274V700H0Z" fill="${c[3]}"/><path d="M0 490 170 420 320 480 520 360 720 483 910 365 1200 450V700H0Z" fill="${c[2]}"/><path d="M0 505Q300 490 600 510T1200 500V700H0Z" fill="url(#water)"/><path d="M760 534h170m-210 20h220m-150 24h100m-235 42h300m-335 33h380" stroke="#c9d7ce" opacity=".13" stroke-width="2"/><path d="M0 650 150 579 270 608 360 700H0m840 50 130-143 230-20v163Z" fill="${c[0]}"/><path d="m1000 342-9 4 9-1 9 1Z" fill="#eff0ea" opacity=".5"/></svg>`)}")`;}
function brand(){return `<div class="brand"><span class="brand-mark">${icon('play')}</span>DDPlayTV</div>`;}
function nav(top=false){return `<${top?'header':'aside'} class="${top?'topnav':'sidebar'}">${brand()}<nav class="nav-items" aria-label="主导航">${[['home','首页'],['library','媒体库'],['search','搜索'],['settings','设置']].map(([id,label])=>`<button class="nav-btn ${page===id?'active':''}" data-nav data-key="nav-${id}" data-action="${id==='search'?'search':'navigate'}" data-page="${id}" ${page===id?'aria-current="page"':''}>${top?'':icon(id)}${label}</button>`).join('')}</nav>${top?'<span class="clock">20:48</span>':'<div class="sidebar-note">属于你的大屏时光<br>本地与远程媒体</div>'}</${top?'header':'aside'}>`;}
function heading(title,right='20:48'){return `<div class="page-top"><h1>${title}</h1><span class="clock">${right}</span></div>`;}
function card(index){const f=films[index];return `<button class="media-card" data-nav data-key="film-${index}" data-action="play" data-index="${index}"><div class="thumbnail"><div class="art" style='background-image:${art(index)}'></div><span class="caption">${f.title}</span>${f.progress?`<div class="progress"><span style="width:${f.progress}%"></span></div>`:''}</div><span class="media-title">${f.title}</span><span class="media-meta">${f.episode}</span></button>`;}
function sources(){return `<div class="source-row"><button class="source-pill" data-nav data-key="source-local" data-action="navigate" data-page="library">${icon('drive')} 本地媒体 <small>12 个视频</small></button><button class="source-pill" data-nav data-key="source-nas" data-action="navigate" data-page="library">${icon('folder')} 客厅 NAS <small>已连接</small></button><button class="source-pill" data-nav data-key="source-add" data-action="add">${icon('plus')} 添加来源</button></div>`;}
function sidebarHome(){return `${nav()}<section class="content">${heading('现在，继续好故事。')}<div class="hero"><div class="art" style='background-image:${art(0)}'></div><div class="hero-copy"><span class="eyebrow">继续观看</span><h2>深海来信</h2><div class="meta"><span>第 04 集 · 潮汐之外</span><span class="badge">1080P</span></div><p>一封来自远方的信，让旅途再次开始。</p><div class="button-row"><button class="primary" data-nav data-key="resume" data-action="play" data-index="0">${icon('play')} 继续播放</button><span class="muted" style="font-size:16px">剩余 9 分钟</span></div></div></div><div class="section-heading"><h2>最近观看</h2><button class="text-button" data-nav data-key="all-media" data-action="navigate" data-page="library">全部媒体 ${icon('next')}</button></div><div class="cards">${films.map((f,i)=>card(i)).join('')}</div>${sources()}</section>`;}
function cinemaHome(){return `<div class="cinema-hero"><div class="art" style='background-image:${art(0)}'></div></div>${nav(true)}<section class="content cinema-content"><div class="cinema-copy"><span class="film-label">D D P L A Y T V · 继续观看</span><h1>深海来信</h1><div class="meta"><span>第 04 集 · 潮汐之外</span><span class="badge">1080P</span><span>23 分钟</span></div><p>有些故事，值得慢慢看。<br>从上次停下的地方，再次出发。</p><button class="primary" data-nav data-key="resume" data-action="play" data-index="0">${icon('play')} 继续播放</button></div><div class="section-heading"><h2>你的观看足迹</h2><button class="text-button" data-nav data-key="all-media" data-action="navigate" data-page="library">浏览媒体库 ${icon('next')}</button></div><div class="cards">${films.map((f,i)=>card(i)).join('')}</div></section>`;}
function fileRow(index){const f=films[index];return `<button class="file-row" data-nav data-key="file-${index}" data-action="play" data-index="${index}"><span class="file-art" style='background-image:${art(index)}'></span><span><strong>${f.file}</strong><small>${f.source} · 1080P · MKV</small></span><span class="file-duration">${f.time}</span></button>`;}
function libraryHome(){return `${nav()}<section class="content library-home">${heading('我的媒体')}<div class="library-heading"><p>从熟悉的收藏里，找一部想看的。</p></div><div class="source-tiles">${[['drive','本地媒体','12 个视频'],['folder','客厅 NAS','最近使用'],['plus','添加来源','连接你的媒体']].map(([glyph,title,sub],i)=>`<button class="source-tile" data-nav data-key="source-${i}" data-action="${i===2?'add':'navigate'}" data-page="library">${icon(glyph)}<span>${title}<small>${sub}</small></span></button>`).join('')}</div><div class="section-heading"><h2>最近打开</h2><span class="muted" style="font-size:16px">4 个视频</span></div><div class="library-split"><div class="file-list">${films.map((f,i)=>fileRow(i)).join('')}</div><div class="inspector"><div class="art" style='background-image:${art(0)}'></div><div class="inspector-copy"><h2>深海来信</h2><p>第 04 集 · 已观看 14 分钟</p><button class="primary" data-nav data-key="resume" data-action="play" data-index="0">${icon('play')} 继续播放</button></div></div></div></section>`;}
function libraryPage(){return `${nav(variant===1)}<section class="content">${heading('媒体库')}<div class="breadcrumb">全部来源 ${icon('next')} 视频</div>${sources()}<div class="section-heading"><h2>最近添加</h2><span class="muted" style="font-size:17px">按添加时间排列</span></div>${variant===2?`<div class="file-list">${films.map((f,i)=>fileRow(i)).join('')}</div>`:`<div class="library-grid">${films.map((f,i)=>card(i)).join('')}</div>`}</section>`;}
function toggleRow(key,label,description){return `<button class="setting-row" data-nav data-key="setting-${key}" data-action="toggle" data-setting="${key}" role="switch" aria-checked="${settings[key]}"><span>${label}<small>${description}</small></span><span class="switch ${settings[key]?'on':''}" aria-hidden="true"></span></button>`;}
function settingsBody(){if(category==='播放')return `<button class="setting-row" data-nav data-key="setting-kernel" data-action="kernel"><span>默认播放器<small>用于打开新的视频</small></span><span class="setting-value">${settings.kernel}${icon('next')}</span></button>${toggleRow('resume','记住播放位置','下次从离开的地方继续')}${toggleRow('autoplay','顺序播放','当前视频结束后，播放下一个')}`;if(category==='字幕与弹幕')return `${toggleRow('subtitles','显示字幕','播放时默认开启字幕')}${toggleRow('danmaku','显示弹幕','播放时默认开启弹幕')}`;if(category==='媒体与存储')return `${toggleRow('hidden','显示隐藏文件','浏览媒体来源时包含隐藏文件')}<button class="setting-row" data-nav data-key="manage-sources" data-action="navigate" data-page="library"><span>管理媒体来源<small>本地媒体与客厅 NAS</small></span>${icon('next')}</button>`;return `<div class="setting-row"><span>DDPlayTV<small>你的大屏媒体播放器</small></span><span class="setting-value">界面预览</span></div><div class="setting-row"><span>深色外观<small>石墨黑背景 · 清晰的焦点反馈</small></span></div>`;}
function settingsPage(){return `${nav(variant===1)}<section class="content">${heading('设置')}<p class="muted" style="font-size:19px">让每次观看，都合你的习惯。</p><div class="settings-columns"><nav class="setting-categories" aria-label="设置分类">${['播放','字幕与弹幕','媒体与存储','关于'].map(label=>`<button class="category ${label===category?'active':''}" data-nav data-key="category-${label}" data-action="category" data-category="${label}">${label}</button>`).join('')}</nav><div><h2 class="settings-title">${category}</h2><div class="setting-group">${settingsBody()}</div><p class="setting-description">${category==='关于'?'':'修改即时生效。你可以随时回到这里调整。'}</p></div></div></section>`;}
function formatTime(value){return `${Math.floor(value/60).toString().padStart(2,'0')}:${Math.floor(value%60).toString().padStart(2,'0')}`;}
function playerPage(){const f=films[selectedFilm];return `<section class="player"><div class="art" style='background-image:${art(selectedFilm)}'></div><header class="player-header"><button class="icon-btn" data-nav data-key="player-back" data-action="back" aria-label="返回媒体库">${icon('back')}</button><div><strong>${f.title}</strong><p>${f.episode}</p></div></header><span class="player-watermark">DDPlayTV</span><div class="subtitles" style="font-size:${31*subtitleSize/100}px">${subtitle==='关闭'?'':'海的另一边，也有人在等待黎明。'}</div><div class="player-controls"><div class="time-row"><span id="position-label">${formatTime(position)}</span><span>${f.time}</span></div><input type="range" class="seek" data-nav data-key="seek" id="seek" aria-label="播放进度" min="0" max="${f.duration}" step="15" value="${position}"><div class="controls-row"><div class="controls-left"><button class="icon-btn" data-nav data-key="rewind" data-action="seek-back" aria-label="后退15秒">${icon('replay')}</button><button class="play-main" data-nav data-key="pause" data-action="pause" aria-label="${playing?'暂停':'播放'}">${icon(playing?'pause':'play')}</button><button class="icon-btn" data-nav data-key="forward" data-action="seek-forward" aria-label="前进15秒">${icon('forward')}</button><span class="muted" style="margin-left:16px;font-size:17px">${f.source}</span></div><div class="controls-right"><button class="control" data-nav data-key="control-subtitle" data-action="panel" data-panel="字幕">${icon('subtitle')}字幕</button><button class="control" data-nav data-key="control-audio" data-action="panel" data-panel="音轨">${icon('audio')}音轨</button><button class="control" data-nav data-key="control-danmaku" data-action="panel" data-panel="弹幕">${icon('danmaku')}弹幕</button></div></div></div>${panel?playerPanel():''}</section>`;}
function playerPanel(){let body='';if(panel==='字幕')body=`<p class="panel-label">字幕轨道</p>${['简体中文','English','关闭'].map(label=>`<button class="track ${subtitle===label?'selected':''}" data-nav data-key="track-${label}" data-action="subtitle" data-value="${label}" aria-pressed="${subtitle===label}"><span>${label}<small>${label==='关闭'?'不显示字幕':label==='English'?'内嵌 · SRT':'内嵌 · ASS'}</small></span>${subtitle===label?icon('check'):''}</button>`).join('')}<p class="panel-label">字幕大小</p><div class="stepper"><button data-nav data-key="size-less" data-action="size-less" aria-label="缩小字幕">−</button><output>${subtitleSize}%</output><button data-nav data-key="size-more" data-action="size-more" aria-label="放大字幕">+</button></div>`;else if(panel==='音轨')body=`<p class="panel-label">可用音轨</p>${['日语 · 立体声','中文 · 立体声'].map(label=>`<button class="track ${audioTrack===label?'selected':''}" data-nav data-key="audio-${label}" data-action="audio" data-value="${label}"><span>${label}<small>AAC · 2.0</small></span>${audioTrack===label?icon('check'):''}</button>`).join('')}`;else body=`${toggleRow('danmaku','显示弹幕','保留画面，也保留陪伴')}<p class="panel-label">弹幕来源</p><div class="track"><span>本地弹幕<small>深海来信 - E04.xml</small></span></div>`;return `<aside class="player-panel" role="dialog" aria-modal="true" aria-label="${panel}设置"><div class="panel-title"><h2>${panel}</h2><button class="icon-btn" data-nav data-key="panel-close" data-action="close-panel" aria-label="关闭设置">${icon('close')}</button></div>${body}<p class="panel-footnote">返回键关闭面板，继续观看。</p></aside>`;}
function dialogMarkup(){return `<div class="dialog-shade"><section class="dialog" role="dialog" aria-modal="true" aria-label="${dialog==='search'?'搜索媒体':'添加媒体来源'}">${dialog==='search'?'<h2>搜索你的媒体</h2><input id="search-input" data-nav data-key="search-input" placeholder="输入片名" aria-label="搜索片名"><div id="search-results" class="file-list">'+films.map((f,i)=>fileRow(i)).join('')+'</div>':'<h2>添加媒体来源</h2><p>选择你想连接的来源类型。</p><div class="file-list">'+['局域网共享 · SMB','远程文件 · WebDAV','文件传输 · FTP'].map((label,i)=>`<button class="file-row" data-nav data-key="add-type-${i}" data-action="source-demo">${icon('folder')}<strong>${label}</strong></button>`).join('')+'</div>'}<div class="button-row"><button class="secondary" data-nav data-key="dialog-close" data-action="close-dialog">返回</button></div></section></div>`;}
function activeScope(){return stage.querySelector('.dialog')||stage.querySelector('.player-panel')||stage;}
function focusKey(key){const scope=activeScope();const target=Array.from(scope.querySelectorAll('[data-nav]')).find(el=>el.dataset.key===key)||scope.querySelector('[data-nav]');target?.focus({preventScroll:true});}
function render(key){stage.className='stage'+(variant===1&&page!=='player'?' top-layout':'');stage.innerHTML=page==='home'?[sidebarHome,cinemaHome,libraryHome][variant]():page==='library'?libraryPage():page==='settings'?settingsPage():playerPage();if(dialog)stage.insertAdjacentHTML('beforeend',dialogMarkup());updateReview();if(key)requestAnimationFrame(()=>focusKey(key));}
function updateReview(){document.getElementById('variant-label').textContent=`${variant+1} / 3 · ${variants[variant].name}`;document.getElementById('variant-dots').innerHTML=variants.map((v,i)=>`<button aria-label="${v.name}" aria-pressed="${variant===i}" data-variant="${i}"></button>`).join('');const pageNames={home:'首页',library:'媒体库',settings:'设置',player:'播放交互演示（静态画面）'};document.getElementById('review-status').textContent=`${pageNames[page]} · ${panel?panel+'面板':variants[variant].description}${page==='settings'?' · 设置仅在本次预览中保留':''}`;}
function currentKey(){return document.activeElement?.dataset.key;}
function go(next,key){historyStack.push({page,focus:currentKey()});page=next;panel=null;dialog=null;render(key||(next==='player'?'pause':next==='home'?'resume':next==='library'?'film-0':'category-播放'));}
function back(){if(dialog){dialog=null;render(opener);return;}if(panel){panel=null;render(opener);return;}const previous=historyStack.pop();if(previous){page=previous.page;render(previous.focus);}else if(page!=='home'){page='home';render('resume');}else focusKey('nav-home');}
function switchVariant(change,absolute=false){variant=absolute?change:(variant+change+variants.length)%variants.length;page='home';panel=null;dialog=null;historyStack=[];const url=new URL(location.href);url.searchParams.set('variant',variants[variant].id);history.replaceState(null,'',url);render();}
function updatePosition(){position=Math.max(0,Math.min(position,films[selectedFilm].duration));const range=stage.querySelector('#seek');if(range)range.value=position;const text=stage.querySelector('#position-label');if(text)text.textContent=formatTime(position);}
stage.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const key=button.dataset.key;switch(button.dataset.action){case'navigate':if(button.dataset.page!==page)go(button.dataset.page);break;case'play':selectedFilm=Number(button.dataset.index);position=Math.round(films[selectedFilm].duration*films[selectedFilm].progress/100);playing=true;go('player');break;case'back':back();break;case'pause':playing=!playing;button.innerHTML=icon(playing?'pause':'play');button.setAttribute('aria-label',playing?'暂停':'播放');break;case'seek-back':position-=15;updatePosition();break;case'seek-forward':position+=15;updatePosition();break;case'panel':opener=key;panel=button.dataset.panel;render(panel==='字幕'?'track-'+subtitle:panel==='音轨'?'audio-'+audioTrack:'setting-danmaku');break;case'close-panel':case'close-dialog':back();break;case'subtitle':subtitle=button.dataset.value;render(key);break;case'audio':audioTrack=button.dataset.value;render(key);break;case'size-less':subtitleSize=Math.max(70,subtitleSize-10);render(key);break;case'size-more':subtitleSize=Math.min(150,subtitleSize+10);render(key);break;case'toggle':settings[button.dataset.setting]=!settings[button.dataset.setting];if(button.dataset.setting==='subtitles')subtitle=settings.subtitles?'简体中文':'关闭';render(key);break;case'kernel':settings.kernel=settings.kernel==='Media3'?'mpv':'Media3';render(key);break;case'category':category=button.dataset.category;render(key);break;case'search':opener=key;dialog='search';render('search-input');break;case'add':opener=key;dialog='add';render('add-type-0');break;case'source-demo':document.getElementById('review-status').textContent='来源配置仅展示入口；本原型不建立连接或保存账号。';break;}});
stage.addEventListener('input',event=>{if(event.target.id==='seek'){position=Number(event.target.value);updatePosition();}if(event.target.id==='search-input'){const query=event.target.value.trim().toLowerCase();const results=films.map((film,index)=>({film,index})).filter(({film})=>(film.title+film.file).toLowerCase().includes(query));stage.querySelector('#search-results').innerHTML=results.length?results.map(({index})=>fileRow(index)).join(''):'<div class="empty">没有找到匹配的视频</div>';}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'||(event.key==='Backspace'&&!event.target.matches('input,textarea'))){if(stage.contains(document.activeElement)){event.preventDefault();back();}return;}if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;if(document.activeElement.closest('.variant-bar')){if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();switchVariant(event.key==='ArrowLeft'?-1:1);}return;}if(!stage.contains(document.activeElement))return;const origin=document.activeElement;if(origin.matches('input:not([type=range]),textarea,[contenteditable]')&&event.key!=='ArrowDown')return;if(origin.matches('input[type=range]')&&['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const rect=origin.getBoundingClientRect(),vertical=event.key==='ArrowUp'||event.key==='ArrowDown',positive=event.key==='ArrowDown'||event.key==='ArrowRight';const ox=rect.x+rect.width/2,oy=rect.y+rect.height/2;const candidates=Array.from(activeScope().querySelectorAll('[data-nav]')).filter(el=>el!==origin&&!el.disabled&&el.getClientRects().length);const ranked=candidates.map(el=>{const r=el.getBoundingClientRect(),dx=r.x+r.width/2-ox,dy=r.y+r.height/2-oy;const along=vertical?dy:dx,across=vertical?dx:dy;const aligned=vertical?(r.left<rect.right&&r.right>rect.left):(r.top<rect.bottom&&r.bottom>rect.top);return{el,valid:positive?along>8:along< -8,score:Math.abs(along)+Math.abs(across)*2+(aligned?0:1200)};}).filter(x=>x.valid).sort((a,b)=>a.score-b.score);if(ranked[0]){ranked[0].el.focus({preventScroll:true});if(ranked[0].el.closest('#search-results'))ranked[0].el.scrollIntoView({block:'nearest'});}});
document.getElementById('previous-variant').onclick=()=>switchVariant(-1);document.getElementById('next-variant').onclick=()=>switchVariant(1);document.getElementById('variant-dots').onclick=event=>{if(event.target.dataset.variant!==undefined)switchVariant(Number(event.target.dataset.variant),true);};
function resize(){const box=document.getElementById('preview');const scale=document.fullscreenElement?Math.min(box.clientWidth/1440,box.clientHeight/810):box.clientWidth/1440;stage.style.transform=`scale(${scale})`;}
new ResizeObserver(resize).observe(document.getElementById('preview'));document.getElementById('fullscreen').onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.getElementById('preview').requestFullscreen();focusKey(page==='home'?'resume':undefined);};document.addEventListener('fullscreenchange',resize);
setInterval(()=>{if(page==='player'&&playing){position+=1;if(position>=films[selectedFilm].duration){position=films[selectedFilm].duration;playing=false;const button=stage.querySelector('[data-action=pause]');if(button){button.innerHTML=icon('play');button.setAttribute('aria-label','播放');}}updatePosition();}},1000);
render('resume');resize();
</script>
</body>
</html>
