<!doctype html>
<!-- Supplemental Cinema specification. Fixtures are preview-only. -->
<html lang="zh-CN"><meta charset="utf-8"><title>DDPlayTV · 子页面补全</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111114;color:#f5f5f7;font:21px "Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit;color:inherit}button{white-space:nowrap;flex-shrink:0;background:#303038;border:1px solid #ffffff18;border-radius:14px;padding:0 22px;min-height:66px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f5f5f7;outline-offset:2px}.primary{background:#f5f5f7;color:#111114}input,textarea{width:100%;border:1px solid #ffffff30;border-radius:12px;padding:16px;background:#15151a}h1,h2,h3,p{margin:0}h1{font-size:36px;font-weight:500}h2{font-size:27px}h3{font-size:24px}p,small,.muted{color:#a3a3af;line-height:1.6}small{font-size:18px}small[style]{display:block}#stage{width:1440px;height:810px;position:relative;overflow:hidden;transform-origin:top left}.dialog{width:660px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:22px;background:#202026;border:1px solid #ffffff18;max-height:738px;display:flex;flex-direction:column}.dialog h2{padding:27px 30px}.content{padding:0 30px;overflow:auto;min-height:0}.actions{display:flex;gap:24px;padding:30px}.actions button{flex:1;min-height:72px}.row{display:flex;gap:18px;align-items:center}.chips{display:flex;flex-wrap:wrap;gap:15px;margin-top:18px}.label{display:block;font-size:20px;margin:18px 0 12px}.page{height:100%;padding:0 54px 36px}.heading{height:99px;display:flex;gap:24px;align-items:center}.heading button{min-height:54px;width:54px;padding:0;border-radius:50%}.toolbar{display:flex;gap:18px;align-items:center;margin-bottom:18px}.toolbar input{flex:1}.surface{background:#202026;border:1px solid #ffffff14;border-radius:20px;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{text-align:left;padding:0;overflow:hidden;min-width:0}.art{height:144px;background:linear-gradient(140deg,#313847,#1b2028);display:grid;place-items:center;color:#a3a3af}.card span{display:block;padding:12px 18px;font-size:21px;line-height:1.4}.state{height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}.details{display:grid;grid-template-columns:210px 1fr;gap:42px}.poster{height:315px;border-radius:18px;background:linear-gradient(135deg,#374957,#202026);display:grid;place-items:center}.tabs{display:flex;gap:18px;margin:24px 0 18px}.child{height:450px;overflow:auto;padding:18px}.item{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;margin-bottom:12px;padding:15px 18px}.item small{display:block;margin-top:6px}.video{position:absolute;inset:0;background:url('previews/player-controls-baseline.png') center/cover}.toast{position:absolute;top:120px;left:54px;max-width:630px;background:#202026ee;border:1px solid #ffffff25;border-radius:14px;padding:18px 24px;line-height:1.5}.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#202026ee;border:1px solid #ffffff25;border-radius:18px;padding:24px 30px;display:flex;align-items:center;gap:18px}.spinner{width:36px;height:36px;border:4px solid #ffffff30;border-top-color:#f5f5f7;border-radius:50%}progress{width:100%;height:10px;accent-color:#f5f5f7;margin:22px 0}#review{position:fixed;bottom:5px;left:5px;z-index:9;background:#111e;padding:8px;font-size:14px}select{color:white;background:#303038;padding:6px}.capture #review{display:none}
</style><main id="stage"></main><nav id="review"><select id="page"></select><select id="state"><option>normal</option><option>empty</option><option>loading</option><option>error</option><option>long</option><option>mark</option></select> 示例数据 · 结构规格</nav>
<script>
const q=new URLSearchParams(location.search),pages={segment:'构建搜索词',extensions:'视频扩展名',avatar:'选择头像',font:'缓存字体',follow:'我的追番',history:'云端播放历史',intro:'番剧简介',episodes:'番剧分集',recommend:'相关作品',loading:'播放加载',message:'播放提示'};
let page=q.get('page')||'segment',state=q.get('state')||'normal';const stage=document.getElementById('stage');if(q.has('capture'))document.body.classList.add('capture');
const b=(s,c='')=>`<button class="${c}">${s}</button>`,dialog=(title,body,actions=b('取消')+b('确定','primary'),width=660)=>`<section class="dialog" style="width:${width}px"><h2>${title}</h2><div class="content">${body}</div>${actions?`<div class="actions">${actions}</div>`:''}</section>`,header=t=>`<header class="heading">${b('‹')}<h1>${t}</h1></header>`;
const names=['药屋少女的呢喃','葬送的芙莉莲','夏目友人帐','宇宙よりも遠い場所','长标题示例：在故事与日常之间寻找每一处细微的线索','紫罗兰永恒花园'];
const cards=(n=6)=>`<div class="grid">${Array.from({length:n},(_,i)=>`<button class="card"><div class="art">封面</div><span>${names[i%names.length]}</span></button>`).join('')}</div>`;
const status=()=>`<div class="state"><h2>${{empty:'暂无内容',loading:'正在加载…',error:'加载失败'}[state]}</h2><p>${state==='empty'?'暂无匹配作品，可清空搜索或刷新列表。':state==='error'?'请检查连接后重试。已有内容会保留。':'正在获取列表，请稍候。'}</p></div>`;
function render(){let html='';
if(page==='segment')html=dialog('构建搜索词',`<p>选择候选词拼接搜索内容，也可直接编辑。</p><span class="label">搜索内容</span><div class="row"><input value="${state==='empty'?'':'药屋少女'}">${b('清空')}</div><span class="label">候选词</span><div class="chips">${['空格','删除',...(state==='empty'?[]:state==='long'?Array.from({length:30},(_,i)=>'候选词 '+i):['药屋少女','的呢喃','S01','E03','1080p'])].map(x=>b(x)).join('')}</div>${state==='empty'?'<p style="margin-top:18px">没有候选词，可直接输入搜索内容。</p>':''}`,b('取消')+b('搜索','primary'));
else if(page==='extensions')html=dialog('支持的视频扩展名',`<p>扫描时只识别下列格式的文件。</p><span class="label">扩展名 · 用英文逗号分隔</span><textarea rows="3">${state==='error'?'': 'mkv,mp4,avi,mov,wmv,m4v,flv,m2ts'}</textarea><p style="margin-top:12px">不需要输入点号。例如：mkv,mp4,avi</p>${state==='error'?'<p style="color:#ffb4ab;margin-top:12px">请输入至少一个扩展名。</p>':''}<div style="margin-top:18px">${b('恢复默认并保存')}</div><small>恢复默认会立即保存；编辑后选择「保存」。</small>`,b('取消')+b('保存','primary'));
else if(page==='avatar')html=dialog('选择头像',`<p>选择后立即应用</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px;height:336px;overflow:auto">${Array.from({length:12},(_,i)=>`<button style="min-height:156px;padding:15px"><div style="width:90px;height:90px;background:#41414b;border-radius:50%;margin:auto"></div><small>头像 ${i+1}</small></button>`).join('')}</div><small style="margin-top:12px">保留原作者署名与版权信息</small>`,b('取消'),840);
else if(page==='font')html=dialog('缓存字体',`<p>将目录中的字体缓存到本机，用于字幕显示。</p><div class="row" style="justify-content:space-between;margin-top:30px"><h3>${state==='loading'?'正在准备…':'正在缓存…'}</h3><h2>${state==='loading'?'0':'41'}%</h2></div><progress max="100" value="${state==='loading'?0:41}"></progress><p>${state==='loading'?'正在统计字体文件':'已缓存 5 / 12 个字体'}</p><small style="margin:18px 0 30px">完成后自动关闭，请稍候。</small>`,'');
else if(page==='follow'||page==='history')html=`<section class="page">${header(pages[page])}<div class="toolbar"><input placeholder="搜索当前列表">${b('清空')}${b('刷新')}</div><p style="margin-bottom:18px">${state==='normal'||state==='long'?'6 部作品 · 确认查看详情':'列表状态'}</p><div class="surface" style="height:513px;overflow:auto">${['empty','loading','error'].includes(state)?status():cards(state==='long'?18:6)}</div></section>`;
else if(['intro','episodes','recommend'].includes(page)){let child='';
if(page==='intro')child=`<div class="chips" style="margin-top:0">${['悬疑','日常','改编'].map(x=>b(x)).join('')}</div><div class="row" style="margin:24px 0"><div style="flex:1">已完结<small style="display:block">播出状态</small></div><div style="flex:1">TV<small style="display:block">作品类型</small></div><div style="flex:1">9.1<small style="display:block">评分</small></div></div><h3>作品资料</h3><p style="margin:12px 0">2023 年 · 日本 · 24 集</p>${b('展开完整资料')}<h3 style="margin-top:24px">剧情简介</h3><p style="margin-top:12px">${state==='empty'?'暂无简介':('在故事与日常之间，寻找每一处细微的线索。少女的旅程由此展开。').repeat(state==='long'?20:3)}</p>`;
if(page==='episodes')child=`<div class="toolbar">${state==='mark'?b('标记看过','primary')+b('退出')+b('全选')+b('反选'):`<h3 style="flex:1">共 24 集</h3>${b('批量标记')}${b('正序 ↑')}`}</div>${state==='empty'?'<div class="state" style="height:260px"><h2>暂无分集信息</h2></div>':Array.from({length:24},(_,i)=>`<button class="item"><span>第 ${i+1} 集 · ${i===1?'这是一个较长的分集标题，用于检查两行显示':'旅程的开始'}<small>${i===0?'上次观看 · 2026-10-31':'暂无本地播放记录'}</small></span><span>${state==='mark'?'□':i===0?'▶':'✓'}</span></button>`).join('')}`;
if(page==='recommend')child=state==='empty'?'<div class="state"><h2>暂无推荐作品</h2></div>':`<h3 style="margin-bottom:18px">相关作品</h3>${cards(3)}<h3 style="margin:24px 0 18px">更多推荐</h3>${cards(6)}`;
html=`<section class="page">${header('番剧详情')}<div class="details"><aside><div class="poster">封面</div><div style="margin-top:18px">${b('追番')}</div></aside><section><h1>药屋少女的呢喃</h1><p style="margin-top:12px">已完结 · TV · 9.1</p><div class="tabs">${['intro','episodes','recommend'].map(x=>b(pages[x].replace('番剧',''),x===page?'primary':'')).join('')}</div><div class="surface child">${child}</div></section></div></section>`;}
else html='<div class="video"></div>'+(page==='loading'?`<div class="loading"><div class="spinner"></div><span>${state==='loading'?'正在缓冲…':'正在准备播放…'}</span></div>`:`<div class="toast">${state==='long'?'当前字幕文件加载失败，请检查文件是否可用，然后在播放设置中重新选择。':'播放速度已调整为 1.25 倍'}</div>`);
stage.innerHTML=html;stage.querySelector('button')?.focus();}
const p=document.getElementById('page'),s=document.getElementById('state');p.innerHTML=Object.entries(pages).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');p.value=page;s.value=state;p.onchange=()=>{page=p.value;render()};s.onchange=()=>{state=s.value;render()};function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1440,innerHeight/810)})`}addEventListener('resize',fit);render();fit();
</script></html>
