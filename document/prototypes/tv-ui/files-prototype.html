x}

.review-bottom{max-width:1440px;margin:18px auto 110px;padding:0 6px;display:flex;justify-content:space-between;gap:22px;color:#8e8e9c;font-size:13px}.review-bottom p{line-height:1.7;max-width:850px}.switcher{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:10px;border-radius:20px;border:1px solid #ffffff25;background:#313139f5;box-shadow:0 12px 50px #0008;z-index:20}.switcher button{background:transparent;padding:11px 16px;border-radius:12px;color:#b3b3c0;font-size:14px;white-space:nowrap}.switcher button.active{background:#f3f3f7;color:#1c1c22}.switcher .cycle{font-size:23px;padding:3px 12px;color:#ddd}.viewport:fullscreen{width:100vw;height:100vh;max-width:none;border:0;border-radius:0}.viewport:fullscreen .stage{left:50%;top:50%;transform-origin:center}.capture .review,.capture .review-bottom,.capture .switcher{display:none}.capture .viewport{width:100vw;height:100vh;border:0;border-radius:0;max-width:none;aspect-ratio:auto}

<body>
<header class="review"><strong>DDPlayTV</strong><span>文件浏览 · 已选 C / 示例数据</span><div class="tools"><label>场景<select id="scene"><option value="root">六个文件夹</option><option value="videos">视频与长文件名</option><option value="mixed">文件夹与视频混排</option><option value="empty">空目录</option><option value="error">加载失败</option><option value="loading">正在加载</option><option value="more">分页加载</option></select></label><button id="fullscreen">全屏体验 ↗</button></div></header>
<div class="viewport" id="viewport"><main class="stage" id="stage" aria-label="文件浏览交互原型"></main></div>
<footer class="review-bottom"><p id="description"></p><a href="index.html?variant=cinema">返回整套沉浸放映原型 ↗</a></footer>
<div class="switcher" aria-label="文件浏览布局方案"><button class="cycle" id="previous" aria-label="上一个方案">‹</button><button data-variant="grid">A · 目录网格</button><button data-variant="list">B · 紧凑列表</button><button data-variant="preview">C · 列表与预览（已选）</button><button class="cycle" id="next" aria-label="下一个方案">›</button></div>
<script>
const stage=document.getElementById('stage');
const params=new URLSearchParams(location.search),variants=['grid','list','preview'];
let variant=variants.includes(params.get('variant'))?params.get('variant'):'preview';
let scene=['root','videos','mixed','empty','error','loading','more'].includes(params.get('scene'))?params.get('scene'):'root';
let locationName=scene==='root'?'根目录':'TV',query='',descending=false,modal=null,opener='',selectedId='',loadedMore=false;
const stack=[];
const symbols={play:'<path d="m8 4 12 8-12 8Z" fill="currentColor" stroke="none"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9H3Z"/>',back:'<path d="m14 5-7 7 7 7"/>',next:'<path d="m9 5 7 7-7 7"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',sort:'<path d="M4 6h16M4 12h11M4 18h6"/>',refresh:'<path d="M20 6v5h-5M4 18v-5h5M19 10a7 7 0 0 0-12-4M5 14a7 7 0 0 0 12 4"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',check:'<path d="m5 12 4 4L19 6"/>',warning:'<path d="m12 3 10 17H2Z"/><path d="M12 9v4m0 3v1"/>',video:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m10 8 6 4-6 4Z"/>',loading:'<path d="M12 3a9 9 0 1 1-9 9"/>'};
const icon=(key,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${symbols[key]||symbols.folder}</svg>`;
const folderIcon=()=>'<svg class="folder-symbol" viewBox="0 0 64 50" fill="none" aria-hidden="true"><path d="M5 13a5 5 0 0 1 5-5h15l7 7h22a5 5 0 0 1 5 5v23H5Z" fill="currentColor" fill-opacity=".10" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M6 21h52" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/></svg>';
const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const folders=['Anime','chara card','Comic','Movies','Music','TV'].map((name,i)=>({id:'folder-'+i,name,type:'folder'}));
const videos=Array.from({length:8},(_,i)=>({id:'video-'+i,type:'video',name:i===2?'[DDPlayTV] 深海来信 - 03 - 潮汐之外 [WEB-DL 2160p HEVC 10bit][Dolby Vision HDR10][DTS-HD MA 5.1 AAC][简繁日内封字幕][特别收录版].mkv':`深海来信 - ${String(i+1).padStart(2,'0')}.mkv`,size:i===2?'2.36 GB':`${(1.12+i*.17).toFixed(2)} GB`,duration:i===2?'':'23:40',detail:i===1?'已观看 14 分钟':'',cover:i===2?null:i%4}));
function artwork(index){const palettes=[['#142832','#48636b','#1e3843'],['#243931','#839082','#3e5c4e'],['#392e3b','#a9827e','#604859'],['#222c42','#686f8c','#343d58']],c=palettes[index];const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><path fill="url(#s)" d="M0 0h900v500H0Z"/><circle cx="680" cy="130" r="28" fill="#dedbd0" opacity=".8"/><path d="m0 340 170-140 150 95 200-190 180 230 200-130v295H0" fill="${c[2]}"/><path d="m0 400 220-110 200 145 230-90 250 60v95H0" fill="${c[0]}"/><path d="M0 440h900v60H0" fill="${c[1]}" opacity=".18"/></svg>`;return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;}
function items(){let data=scene==='root'?folders:scene==='mixed'?[{id:'season',name:'Season 02',type:'folder'},{id:'extras',name:'Extras',type:'folder'},...videos.slice(0,5)]:['empty','error','loading'].includes(scene)?[]:videos.slice(0,scene==='more'&&!loadedMore?4:8);data=data.filter(item=>item.name.toLowerCase().includes(query.toLowerCase()));const directories=data.filter(i=>i.type==='folder').sort((a,b)=>a.name.localeCompare(b.name)),files=data.filter(i=>i.type==='video').sort((a,b)=>a.id.localeCompare(b.id));return descending?[...directories.reverse(),...files.reverse()]:[...directories,...files];}
function syncUrl(){const url=new URL(location.href);url.searchParams.set('variant',variant);url.searchParams.set('scene',scene);history.replaceState(null,'',url);}
function nav(){return `<header class="topnav"><a class="brand" href="index.html?variant=cinema" data-nav><span class="brand-mark">${icon('play')}</span>DDPlayTV</a><nav class="nav" aria-label="主导航">${['首页','媒体库','搜索','设置'].map((name,i)=>`<a ${i===1?'class="active" aria-current="page"':''} data-nav href="index.html?variant=cinema&page=${['home','library','search','settings'][i]}">${name}</a>`).join('')}</nav><span class="clock">20:48</span></header>`;}
function row(item,tile=false){if(tile)return `<button data-nav data-key="${item.id}" data-item="${item.id}" class="folder-tile">${folderIcon()}<strong>${esc(item.name)}</strong>${icon('next','chevron')}</button>`;const video=item.type==='video';return `${video?'<div class="file-entry">':''}<button data-nav data-key="${item.id}" data-item="${item.id}" class="file-row ${video?'':'folder'}">${video?`<span class="thumb" ${item.cover===null?'':`style='background-image:${artwork(item.cover)}'`}>${item.cover===null?icon('video'):''}${item.detail?'<span class="watch-progress"><i></i></span>':''}</span>`:folderIcon()}<span class="text"><strong>${esc(item.name)}</strong>${video?`<small>${item.size} · MKV${item.detail?' · '+item.detail:''}</small>`:''}</span><span class="tail">${video?item.duration:icon('next','chevron')}</span></button>${video?`<button class="more-button" data-nav data-key="more-${item.id}" data-action="file-more" data-for="${item.id}" aria-label="${esc(item.name)}的更多操作">⋯</button></div>`:''}`;}
function inspector(item){if(!item)return '';return `<div class="inspector-art ${item.type==='folder'?'is-folder':''}" ${item.cover!=null?`style='background-image:${artwork(item.cover)}'`:''}>${item.type==='folder'?folderIcon():item.cover===null?icon('video'):''}</div><div class="inspector-copy"><h2>${esc(item.name)}</h2><p>${item.type==='folder'?'文件夹':`${item.size} · MKV${item.duration?' · '+item.duration:''}`}</p><p class="detail-label">当前位置</p><p>115 / ${locationName==='根目录'?'根目录':esc(locationName)}</p><p class="hint">${item.type==='folder'?'按确定打开文件夹':'按确定播放 · 按菜单查看文件操作'}</p></div>`;}
function stateContent(){const states={empty:['folder','这个文件夹是空的','可以返回上一级，继续浏览其他内容。'],error:['warning','暂时无法读取目录','请检查网络连接，然后重试。'],loading:['loading','正在读取目录','文件较多时，可能需要稍等片刻。']},s=states[scene];if(!s)return '';return `<div class="state-panel" role="status">${icon(s[0])}<h2>${s[1]}</h2><p>${s[2]}</p><div class="state-actions">${scene==='error'?'<button data-nav data-key="retry" data-action="retry">重新加载</button>':''}<button data-nav data-key="state-back" data-action="back" class="${scene==='error'?'sub':''}">返回上一级</button></div></div>`;}
function body(){if(['empty','error','loading'].includes(scene))return stateContent();const data=items();if(!data.length)return '<div class="state-panel"><h2>没有找到匹配的文件</h2><p>试试其他关键词，或清除搜索。</p><button data-nav data-action="clear-search" data-key="clear-search">清除搜索</button></div>';const grid=variant==='grid'&&scene==='root';return `<div class="scroll" id="file-scroll">${variant==='list'?'<div class="list-heading"><span>名称</span><span>时长 / 打开</span></div>':''}<div class="${grid?'folder-grid':'file-list'}">${data.map(item=>row(item,grid)).join('')}</div>${scene==='more'&&!loadedMore?'<button class="load-more" data-nav data-key="load-more" data-action="load-more">加载更多</button>':scene!=='root'?'<p class="ending">已全部显示</p>':''}</div>${variant==='preview'?`<aside class="inspector" aria-label="当前文件预览">${inspector(data.find(item=>item.id===selectedId)||data[0])}</aside>`:''}`;}
function render(focusKey){const data=items(),folderCount=data.filter(i=>i.type==='folder').length,videoCount=data.length-folderCount;stage.innerHTML=`${nav()}<header class="page-head"><button class="back" data-nav data-action="back" data-key="back" aria-label="返回上一级">${icon('back')}</button><div class="page-title"><h1>115</h1><p>浏览文件</p></div><div class="toolbar"><button data-nav data-action="search" data-key="search">${icon('search')}搜索</button><button data-nav data-action="sort" data-key="sort">${icon('sort')}名称${descending?'降序':'升序'}</button><button data-nav data-action="refresh" data-key="refresh">${icon('refresh')}刷新</button></div></header><nav class="pathbar" aria-label="当前位置"><button data-nav data-action="root" data-key="root" class="${scene==='root'?'current':''}">根目录</button>${scene!=='root'?`${icon('next')}<button data-nav data-key="current" data-action="current" class="current">${esc(locationName)}</button>`:''}${query?`<button data-nav data-key="clear-search" data-action="clear-search">“${esc(query)}” ×</button>`:''}<span class="count">${['loading','error'].includes(scene)?'':`${folderCount?folderCount+' 个文件夹':''}${folderCount&&videoCount?' · ':''}${videoCount?videoCount+' 个视频':''}${!data.length?'0 个项目':''}`}</span></nav><section class="browser-body ${variant}-layout">${body()}</section><footer class="bottom"><span>${scene==='root'?'已全部显示':scene==='more'&&!loadedMore?'已加载 4 个视频':query?'当前目录搜索结果':'115 / '+esc(locationName)}</span><div class="keys"><span><kbd>方向键</kbd>选择</span><span><kbd>确定</kbd>打开</span><span><kbd>菜单</kbd>更多</span><span><kbd>返回</kbd>上一级</span></div></footer><div id="modal-slot"></div>`;
document.getElementById('scene').value=scene;document.querySelectorAll('[data-variant]').forEach(el=>{el.classList.toggle('active',el.dataset.variant===variant);el.setAttribute('aria-pressed',String(el.dataset.variant===variant));});document.getElementById('description').textContent=({grid:'A · 历史对照：纯文件夹采用三列网格，六个目录一屏展示；进入目录后使用视频列表。沿用沉浸放映的深色卡片、留白和白色焦点。',list:'B · 紧凑列表：目录与视频使用同一列，弱化卡片背景，方便阅读长名称；布局稳定，但画面更偏文件管理器。',preview:'C · 已选 / 实施暂缓：左侧快速浏览，右侧随焦点显示文件信息和已有封面；无封面显示占位，目录不自动扫描或拼贴图片。'})[variant]+' 所有名称、封面、大小和进度都是示例。Enter 打开，Esc 返回，M / 菜单键显示文件操作。';
syncUrl();focus(focusKey||data[0]?.id||(['error'].includes(scene)?'retry':'state-back'));}
function focus(key){const el=Array.from(stage.querySelectorAll('[data-key]')).find(el=>el.dataset.key===key);el?.focus({preventScroll:true});if(el?.dataset.item)el.scrollIntoView({block:'nearest'});}
function setScene(next,name){scene=next;locationName=name||(next==='root'?'根目录':'TV');query='';loadedMore=false;modal=null;render();}
function openItem(id){const item=items().find(i=>i.id===id);if(!item)return;if(item.type==='folder'){stack.push({scene,locationName,query,selectedId:id,scroll:document.getElementById('file-scroll').scrollTop});setScene(item.name==='Extras'?'empty':'videos',scene==='root'?item.name:locationName+' / '+item.name);}else showModal('play',id);}
function back(){if(modal){modal=null;document.getElementById('modal-slot').innerHTML='';focus(opener);return;}const previous=stack.pop();if(previous){scene=previous.scene;locationName=previous.locationName;query=previous.query;render(previous.selectedId);document.getElementById('file-scroll').scrollTop=previous.scroll;}else if(scene!=='root'){setScene('root');}else location.href='index.html?variant=cinema&page=library';}
function showModal(type,key){opener=key||document.activeElement?.dataset.key;const item=items().find(i=>i.id===key)||items().find(i=>i.id===selectedId);modal={type,item};let content='';if(type==='search')content='<h2>搜索当前目录</h2><p>查找已加载的文件与文件夹。</p><input data-nav data-key="search-input" id="search-input" placeholder="输入文件名" value="'+esc(query)+'"><div class="dialog-actions"><button data-nav data-action="close">取消</button><button class="primary" data-nav data-action="apply-search">搜索</button></div>';else if(type==='sort')content=`<h2>文件排序</h2><p>文件夹优先</p>${['名称升序','名称降序'].map((label,i)=>`<button class="option" data-nav data-action="set-sort" data-desc="${i}">${label}${descending===(i===1)?icon('check'):''}</button>`).join('')}`;else if(type==='refresh')content='<h2>目录已刷新</h2><p>这是设计预览，文件示例保持不变。</p><div class="dialog-actions"><button data-nav data-action="close">返回列表</button></div>';else if(type==='play')content=`<h2>${item.detail?'继续播放':'打开视频'}</h2><p class="file-name">${esc(item.name)}</p><p>${item.size} · MKV${item.detail?' · '+item.detail:''}</p><p class="note">此处承接已有播放器。本设计预览不播放视频。</p><div class="dialog-actions"><button data-nav data-action="close">返回文件列表</button></div>`;else if(item)content=`<h2>文件操作</h2><p class="file-name">${esc(item.name)}</p><p>${item.type==='folder'?'文件夹':item.size+' · MKV'} · 115 / ${esc(locationName)}</p><button class="option" data-nav data-action="open-modal-item">${item.type==='folder'?'打开文件夹':'播放视频'}${icon('next')}</button>${item.type==='video'?['绑定弹幕','绑定字幕','绑定音频'].map(label=>`<button class="option" data-nav data-action="binding" data-label="${label}">${label}${icon('next')}</button>`).join(''):''}`;else content='<h2>目录操作</h2><button class="option" data-nav data-action="refresh">刷新目录</button>';
document.getElementById('modal-slot').innerHTML=`<div class="shade"><section class="dialog" role="dialog" aria-modal="true" aria-label="${type==='search'?'搜索当前目录':'目录与文件操作'}"><button class="modal-close" data-nav data-action="close" aria-label="关闭">${icon('close')}</button>${content}</section></div>`;const first=stage.querySelector('.dialog input')||stage.querySelector('.dialog .option')||stage.querySelector('.dialog-actions button')||stage.querySelector('.modal-close');first.focus();}
stage.addEventListener('focusin',event=>{const item=items().find(i=>i.id===event.target.dataset.item);if(item){selectedId=item.id;const panel=stage.querySelector('.inspector');if(panel)panel.innerHTML=inspector(item);}});
stage.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.item){openItem(button.dataset.item);return;}switch(button.dataset.action){case'binding':{const label=button.dataset.label;back();document.getElementById('description').textContent=label+'：此设计仅展示已有功能入口，选择文件沿用现有流程。';break;}case'file-more':showModal('more',button.dataset.for);opener=button.dataset.key;break;case'back':back();break;case'root':stack.length=0;setScene('root');break;case'current':focus(items()[0]?.id);break;case'search':case'sort':case'refresh':showModal(button.dataset.action,button.dataset.key);break;case'close':back();break;case'set-sort':descending=button.dataset.desc==='1';modal=null;render('sort');break;case'apply-search':query=stage.querySelector('#search-input').value.trim();modal=null;render();break;case'clear-search':query='';render();break;case'retry':setScene('videos',locationName);break;case'load-more':loadedMore=true;render(videos[4].id);break;case'open-modal-item':{const id=modal.item.id;modal=null;openItem(id);break;}}});
function switchVariant(value){variant=variants.includes(value)?value:variants[(variants.indexOf(variant)+value+3)%3];modal=null;render(selectedId);}
document.querySelectorAll('[data-variant]').forEach(el=>el.onclick=()=>switchVariant(el.dataset.variant));document.getElementById('previous').onclick=()=>switchVariant(-1);document.getElementById('next').onclick=()=>switchVariant(1);document.getElementById('scene').onchange=event=>{stack.length=0;setScene(event.target.value);};
document.addEventListener('keydown',event=>{if(event.target.closest('.switcher')&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();switchVariant(event.key==='ArrowLeft'?-1:1);return;}if(!stage.contains(event.target))return;const input=event.target.matches('input');if(event.key==='Escape'||(event.key==='Backspace'&&!input)){event.preventDefault();back();return;}if(event.key==='Enter'&&input){event.preventDefault();stage.querySelector('[data-action="apply-search"]').click();return;}if(!input&&['m','M','ContextMenu'].includes(event.key)){event.preventDefault();showModal('more',event.target.dataset.item);return;}if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)||input)return;event.preventDefault();const scope=modal?stage.querySelector('.dialog'):stage;const origin=event.target;if(event.key==='ArrowRight'&&origin.closest('.file-entry')&&origin.dataset.item){origin.closest('.file-entry').querySelector('.more-button').focus();return;}if(event.key==='ArrowLeft'&&origin.classList.contains('more-button')){origin.closest('.file-entry').querySelector('.file-row').focus();return;}const rect=origin.getBoundingClientRect(),vertical=['ArrowUp','ArrowDown'].includes(event.key),positive=['ArrowDown','ArrowRight'].includes(event.key);const choices=Array.from(scope.querySelectorAll('[data-nav]')).filter(el=>el!==origin&&el.getClientRects().length).map(el=>{const r=el.getBoundingClientRect(),dx=r.x+r.width/2-rect.x-rect.width/2,dy=r.y+r.height/2-rect.y-rect.height/2,along=vertical?dy:dx,across=vertical?dx:dy,aligned=vertical?r.left<rect.right&&r.right>rect.left:r.top<rect.bottom&&r.bottom>rect.top;return{el,valid:positive?along>5:along< -5,score:Math.abs(along)+Math.abs(across)*2+(aligned?0:1500)};}).filter(x=>x.valid).sort((a,b)=>a.score-b.score);if(choices[0]){choices[0].el.focus({preventScroll:true});if(modal)choices[0].el.scrollIntoView({block:'nearest'});else if(choices[0].el.closest('.file-entry'))choices[0].el.closest('.file-entry').scrollIntoView({block:'nearest'});else if(choices[0].el.dataset.item||choices[0].el.dataset.action==='load-more')choices[0].el.scrollIntoView({block:'nearest'});}});
function resize(){const view=document.getElementById('viewport'),full=!!document.fullscreenElement,scale=Math.min(view.clientWidth/1440,view.clientHeight/810);stage.style.transform=(full?'translate(-50%, -50%) ':'')+`scale(${scale})`;}
if(params.get('capture')==='1')document.body.classList.add('capture');new ResizeObserver(resize).observe(document.getElementById('viewport'));document.getElementById('fullscreen').onclick=()=>document.getElementById('viewport').requestFullscreen();document.addEventListener('fullscreenchange',resize);render();resize();
</script>
</body>
