body=panel(kind==='danmu'?'弹幕样式':'字幕样式','<div class="scroll">'+(kind==='native'?'<p class="foot">当前字幕使用内核样式，支持调整垂直位置。</p>':'')+labels.map(v=>'<p class="foot">'+v+' <span style="float:right">'+(v.includes('颜色')?'白色':'50%')+'</span></p>'+(v.includes('颜色')?'<input type="color" value="#ffffff" aria-label="'+v+'">':'<input aria-label="'+v+'" type="range" value="50">')).join('')+'</div>','左右微调 · 返回播放设置').replace(button('×','data-back aria-label="关闭"'),button('重置','data-reset-style'));
}
else if(page==='download')body='<section class="dialog surface" style="top:50%;transform:translateY(-50%)"><h2>下载弹幕</h2><p class="foot">下载位置</p><p class="foot">应用弹幕目录 / 药屋少女的呢喃 S01E03.xml</p><p style="margin-top:30px">弹幕来源</p><div class="actions">'+button('◉ 全部来源','class="selected"')+button('○ 仅弹弹play官方')+'</div>'+(state==='loading'?'<p class="foot">正在下载…</p>':state==='error'?'<p class="foot">下载失败，请重试。</p>':'')+'<div class="actions">'+button('取消','data-back')+button('下载','class="primary"')+'</div></section>';
else if(page==='subtitle')body='<section class="dialog surface"><h2>字幕详情</h2><div class="scroll"><div class="fields" style="margin-top:24px">'+field('压缩包文件名','药屋少女的呢喃 S01E03',true)+'</div><p class="foot">文件大小：128 KB</p><p class="foot">文件数量：2</p><p class="foot">字幕语种：简体中文</p><p class="foot">上传时间：2026-10-31</p></div><div class="actions">'+button('取消','data-back')+button('下载','class="primary"')+'</div></section>';
else if(page==='preference')body='<section class="dialog surface"><h2>播放内核</h2><div class="scroll" style="margin-top:24px">'+row('Media3','默认',true)+row('mpv')+'</div><div class="actions">'+button('取消','data-back')+'</div></section>';

else if(page==='files')body=`<section class="dialog surface" style="left:300px;width:840px"><h2>选择文件</h2><p class="foot">内部存储 / Movies / 字幕</p><div class="scroll" style="height:390px;margin-top:22px">${feedback()||row('上一级','返回父目录')+row('Subtitles','文件夹')+row('药屋少女的呢喃 S01E03.ass','字幕文件')+row('药屋少女的呢喃 S01E04.ass','字幕文件')}</div><div class="actions">${button('取消','data-back')}${button('选择当前目录')}</div></section>`;

else body='<section class="splash"><div class="mark">▷</div><h1>DDPlayTV</h1><p>让故事继续</p><div class="bottom-note">DDPlayTV · v4.2.2</div></section>';
stage.innerHTML=body;stage.querySelector('button,input')?.focus();}
pageSelect.onchange=()=>{page=pageSelect.value;render()};stateSelect.onchange=()=>{state=stateSelect.value;render()};
stage.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-reset-style'))stage.querySelectorAll('input[type=range]').forEach(x=>x.value=50);if(b.hasAttribute('data-offset')){offset=Math.round((offset+Number(b.dataset.offset))*10)/10;document.getElementById('offset').textContent=offset}if(b.hasAttribute('data-reset')){offset=0;document.getElementById('offset').textContent=0}if(b.hasAttribute('data-retry')){state='normal';stateSelect.value=state;render()}if(b.hasAttribute('data-back')){stage.innerHTML='<section class="page">'+header('已返回原入口')+'</section>'}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stage.querySelector('[data-back]')?.click();return}if(!e.key.startsWith('Arrow')||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const current=document.activeElement,rect=current.getBoundingClientRect(),vertical=e.key==='ArrowUp'||e.key==='ArrowDown',positive=e.key==='ArrowRight'||e.key==='ArrowDown';const candidates=[...stage.querySelectorAll('button:not(:disabled),input')].filter(x=>x!==current).map(x=>{const r=x.getBoundingClientRect(),dx=r.x+r.width/2-rect.x-rect.width/2,dy=r.y+r.height/2-rect.y-rect.height/2,along=vertical?dy:dx,cross=vertical?dx:dy;return{x,along,cross}}).filter(x=>positive?x.along>5:x.along< -5).sort((a,b)=>Math.abs(a.along)+Math.abs(a.cross)*3-Math.abs(b.along)-Math.abs(b.cross)*3);if(candidates[0]){e.preventDefault();candidates[0].x.focus()}});
function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1440,innerHeight/810)})`}addEventListener('resize',fit);render();fit();
