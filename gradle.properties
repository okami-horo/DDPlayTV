kotlin.code.style=official
# Moshi 1.x qualifiers require KSP1: https://github.com/square/moshi/issues/1874
ksp.useKSP2=false
org.gradle.java.home=.dev-env/jdk/ms-17.0.15
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
media3Version=1.11.1
# Media3 网关能力当前不启用（避免请求 internal 域名导致 DNS 异常上报）
media3_enabled=false
